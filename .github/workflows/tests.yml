
name: Tests

on: [push, pull_request]

jobs:
  Compilation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake ..
          make

  Test_Add:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake ..
          make

      - name: Run test add and capture report
        run: |
          cd build
          echo "== Test add 10 5 ==" > report.txt
          set +e
          ./src/calculator add 10 5 2>&1 | tee -a report.txt
          code=${PIPESTATUS[0]}
          echo "Exit code: $code" >> report.txt
          exit "$code"

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-add-report
          path: build/report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          echo "### Résultat du test add" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/report.txt ]; then
            cat build/report.txt >> "$GITHUB_STEP_SUMMARY"
          fi


  Test_Car:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake ..
          make

      - name: Run test "car" and capture report
        run: |
          cd build
          echo "== Test car 5 ==" > report.txt
          set +e
          ./src/calculator car 5 2>&1 | tee -a report.txt
          code=${PIPESTATUS[0]}
          echo "Exit code: $code" >> report.txt
          exit "$code"

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-car-report
          path: build/report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          echo "### Résultat du test carré" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/report.txt ]; then
            cat build/report.txt >> "$GITHUB_STEP_SUMMARY"
          fi
